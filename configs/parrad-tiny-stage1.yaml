model:
  frame_period_s: 0.09
  frames_per_update: 2
  rd_channels: 1
  rd_height: 93
  rd_width: 128
  md_bins: 128
  radar_dim: 16
  motion_dim: 8
  radar_tokens_per_update: 4
  sensor_vocab_size: 2
  use_sensor_embedding: true
  fusion_heads: 4
  rd_tcn_dilations: [1, 2]
  md_tcn_dilations: [1, 2]
  dropout: 0.0
data:
  train_manifest: data/synthetic_parrad/manifest.jsonl
  split_unit: subject
  preserve_continuous_sessions: true
training:
  seed: 7
  device: cpu
  output_dir: outputs/parrad_tiny_stage1
  batch_size: 2
  num_workers: 0
  epochs: 1
  learning_rate: 0.001
  weight_decay: 0.0
stage:
  variant: parrad
  num_classes: 2
  semantic_supervision: closed_set_activity
