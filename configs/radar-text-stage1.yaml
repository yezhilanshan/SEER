# Paths are relative to this file. Supply YOUR real class-ID -> verb-phrase map.
data:
  train_manifest: ../data/parrad/splits/train.jsonl
  validation_manifest: ../data/parrad/splits/validation.jsonl
  test_manifest: ../data/parrad/splits/test.jsonl
  phrases: ../data/parrad/action_phrases.json
  window_seconds: 12.0
  stride_seconds: 6.0
  min_seconds: 8.0
  max_actions: 3
model:
  feature_dim: 128
  gru_hidden: 128
  gru_layers: 2
  md_context: 9
  tokens: 8
  dropout: 0.1
  normalization: signed_log_zscore
training:
  device: cuda
  seed: 17
  epochs: 20
  batch_size: 4
  encoder_lr: 0.001
  lr: 0.001
  weight_decay: 0.01
  gradient_accumulation: 1
  grad_clip: 1.0
  log_every: 20
  output_dir: ../outputs/radar-text-stage1
