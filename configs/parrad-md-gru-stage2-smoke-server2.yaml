model:
  encoder_type: causal_md_gru
  frame_period_s: 0.09
  frames_per_update: 2
  rd_channels: 1
  rd_height: 93
  rd_width: 128
  md_bins: 128
  radar_dim: 256
  motion_dim: 128
  radar_tokens_per_update: 4
  sensor_vocab_size: 2
  use_sensor_embedding: true
  fusion_heads: 8
  md_gru_dim: 128
  event_tokens: 8
  llm_dim: 896
  llm_layers: 4
  llm_heads: 14
  cross_attn_dim: 512
  cross_attn_heads: 8
  cross_attention_init_scale: 0.001
  event_state_initial_update: 0.1
  semantic_dim: 128
  lora_rank: 16
  max_commit_radar_tokens: 256
  dropout: 0.1
data:
  train_manifest: /usr/local/yzy/keyan2/datasets/PARrad/canonical/phase1/train.jsonl
  validation_manifest: /usr/local/yzy/keyan2/datasets/PARrad/canonical/phase1/validation.jsonl
  test_manifest: /usr/local/yzy/keyan2/datasets/PARrad/canonical/phase1/test.jsonl
  split_unit: subject
  preserve_continuous_sessions: true
  window_frames: 64
  window_stride: 64
  train_window_mode: label_run
  min_label_run_frames: 8
  label_boundary_ignore_seconds: 1.0
training:
  seed: 42
  device: auto
  output_dir: /usr/local/yzy/keyan2/datasets/PARrad/outputs/stage2_causal_md_gru_qwen_smoke
  batch_size: 2
  evaluation_batch_size: 4
  num_workers: 0
  epochs: 1
  learning_rate: 0.0001
  radar_learning_rate: 0.00001
  early_stopping_patience: 4
  weight_decay: 0.01
  grad_clip_norm: 1.0
  amp: true
  amp_init_scale: 512
llm:
  backend: qwen2
  name_or_path: /usr/local/yzy/keyan2/models/Qwen2.5-0.5B-Instruct
  torch_dtype: float16
stage:
  variant: parrad
  num_classes: 14
  stage1_checkpoint: /usr/local/yzy/keyan2/datasets/PARrad/outputs/stage1_causal_md_gru_token_warmup/radar_encoder.pt
  semantic_supervision: deterministic_three_template_label_runs
  templates_per_class: 3
  align_weight: 1.0
  consistency_weight: 0.1
  contrastive_temperature: 0.07
  checkpoint_streaming: true
  semantic_warmup_epochs: 3
  auxiliary_weight: 0.5
  warmup_consistency_weight: 0.1
  text_weight_final: 0.1
  text_weight_ramp_epochs: 2
