model:
  num_joints: 5
  radar_dim: 16
  fusion_heads: 4
  llm_dim: 32
  llm_layers: 4
  llm_heads: 4
  cross_attn_dim: 8
  cross_attn_heads: 2
  semantic_dim: 8
  max_commit_radar_tokens: 16
  dropout: 0.0
data:
  train_manifest: data/synthetic/manifest.jsonl
training:
  seed: 7
  device: cpu
  output_dir: outputs/tiny_stage2
  batch_size: 2
  num_workers: 0
  epochs: 1
  learning_rate: 0.001
  radar_learning_rate: 0.0001
  weight_decay: 0.0
  grad_clip_norm: 1.0
  amp: false
llm:
  backend: tiny
  vocab_size: 64
  prompt_ids: [1, 2, 3]
stage:
  stage1_checkpoint: outputs/tiny_stage1/radar_encoder.pt
  align_weight: 1.0
  consistency_weight: 1.0
  contrastive_temperature: 0.1
  checkpoint_streaming: true
